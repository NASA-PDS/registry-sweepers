[tox]
envlist = py312, py313, docs, lint
isolated_build = True
requires = tox>=4.6

[testenv]
description = run tests
basepython = python3.13
package = wheel
extras = dev
usedevelop = true
commands = pytest --cov=src --cov-report=xml {posargs}

[testenv:py312]
description = run tests with Python 3.12
basepython = python3.12
package = wheel
extras = dev
usedevelop = true
commands = pytest --cov=src --cov-report=xml -m "not db" {posargs}

[testenv:py313]
description = run tests with Python 3.13
basepython = python3.13
package = wheel
extras = dev
usedevelop = true
commands = pytest --cov=src --cov-report=xml -m "not db" {posargs}

[testenv:db]
description = run DB-backed tests (requires OpenSearch via TEST_OPENSEARCH_URL or Docker)
basepython = python3.13
package = wheel
extras = dev
usedevelop = true
passenv = TEST_OPENSEARCH_URL
commands = pytest -m db --cov=src --cov-report=xml {posargs}

[testenv:docs]
description = build docs
extras = dev
commands = sphinx-build -b html docs/source docs/build

[testenv:lint]
description = run linters
skip_install = true
deps = pre-commit
commands = python -m pre_commit run --color=always {posargs:--all}

[coverage:run]
source = src
omit =
    */tests/*
    */test_*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod
